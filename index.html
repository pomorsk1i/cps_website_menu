<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>Mobile Menu</title>
</head>
<body>
    <header class="container">
        <aside>
            <div class="button">
                <button class="button__active">
                    <img src="images/burger.svg" alt="Закрыть меню" class="button-icon">
                </button>
                <img src="images/Group.svg" alt="Логотип CPS" class="button-group">
                <button class="button__active">
                    <img src="images/search.svg" alt="Поиск">
                </button>
            </div>
            <div class="nav">
                <nav>
                    <ul>
                        <li class="nav__element active"><a href="#">Ремонт техники</a></li>
                        <li class="nav__element"><a href="#">Услуги и сервисы</a></li>
                        <li class="nav__element"><a href="#">Корпоративным клиентам</a></li>
                        <li class="nav__element"><a href="#">Продавцам техники</a></li>
                        <li class="nav__element"><a href="#">Партнерам</a></li>
                        <li class="nav__element"><a href="#">Производителям</a></li>
                        <li class="nav__element"><a href="#">Наши сервисные центры</a></li>
                        <li class="nav__element"><a href="#">Контакты</a></li>
                    </ul>
                </nav>
            </div>
            <div class="contact">
                <div class="contact-buttons">
                    <button class="button__active">
                        <img src="images/chat copy.svg" alt="Чат" class="contact__img">
                    </button>
                    <button class="button__active">
                        <img src="images/chat.svg" alt="Сообщения" class="contact__img">
                    </button>
                    <button class="button__active">
                        <img src="images/profile.svg" alt="Профиль" class="contact__img">
                    </button>
                </div>
                <p class="contact__mail">mail@cps.com</p>
                <p class="contact__number">8 800 890 8900</p>
                <div class="lang">
                    <img src="images/lang.svg" alt="Выбор языка">
                </div>
            </div>
        </aside>
    </header>  
</body>
</html>
