<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>Adaptive Menu</title>
</head>
<body class="page">

<header class="menu">
    <div class="menu__inner">
        <div class="menu__header">
            <button class="menu__button">
                <img src="images/burger.svg" alt="Меню">
            </button>

            <img src="images/Group.svg" alt="Логотип CPS" class="menu__logo">

            <button class="menu__button">
                <img src="images/search.svg" alt="Поиск">
            </button>
        </div>

        <nav class="menu__nav">
            <ul class="menu__list">
                <li class="menu__item menu__item--active">
                    <a href="#" class="menu__link">Ремонт техники</a>
                </li>
                <li class="menu__item">
                    <a href="#" class="menu__link">Услуги и сервисы</a>
                </li>
                <li class="menu__item">
                    <a href="#" class="menu__link">Корпоративным клиентам</a>
                </li>
                <li class="menu__item">
                    <a href="#" class="menu__link">Продавцам техники</a>
                </li>
                <li class="menu__item">
                    <a href="#" class="menu__link">Партнерам</a>
                </li>
                <li class="menu__item">
                    <a href="#" class="menu__link">Производителям</a>
                </li>
                <li class="menu__item">
                    <a href="#" class="menu__link">Наши сервисные центры</a>
                </li>
                <li class="menu__item">
                    <a href="#" class="menu__link">Контакты</a>
                </li>
            </ul>
        </nav>

        <div class="menu__footer">
            <div class="menu__contacts">
                <button class="menu__contact-button">
                    <img src="images/chat copy.svg" alt="Чат">
                </button>
                <button class="menu__contact-button">
                    <img src="images/chat.svg" alt="Сообщения">
                </button>
                <button class="menu__contact-button">
                    <img src="images/profile.svg" alt="Профиль">
                </button>
            </div>

            <p class="menu__email">mail@cps.com</p>
            <p class="menu__phone">8 800 890 8900</p>

            <div class="menu__lang">
                <img src="images/lang.svg" alt="Выбор языка">
            </div>
        </div>
    </div>
</header>

</body>
</html>
